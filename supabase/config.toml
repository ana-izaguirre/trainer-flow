# Configuración del proyecto Supabase.
# Documentación: https://supabase.com/docs/guides/local-development/cli/config

project_id = "trainer-flow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# TIENE QUE COINCIDIR CON EL PROYECTO ALOJADO.
#
# Supabase se saltó PostgreSQL 16: sus proyectos corren 15 o 17, y la CLI
# rechaza cualquier otro valor al leer este archivo — antes de intentar nada,
# así que el error no dice que sea esto.
#
# Los proyectos nuevos se crean en 17. Si el tuyo es más viejo y usa 15,
# cámbialo aquí: Project Settings → Infrastructure lo dice.
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
# TrainerFlow no usa Supabase Auth en V1: la identidad del entrenador y de los
# clientes se resuelve por telegram_chat_id dentro de las Edge Functions.
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

# ── Quién puede llamar a cada función ────────────────────────────────────────
#
# ┌─ SIN ESTO, EL WEBHOOK NUNCA CORRE ─────────────────────────────────────┐
# │ Por defecto la pasarela de Supabase exige un JWT ANTES de ejecutar la  │
# │ función. Telegram, Tally y pg_cron no mandan ninguno: la petición se   │
# │ queda en un 401 de la pasarela y el código no llega a verla.           │
# │                                                                         │
# │ Y ese 401 es indistinguible del que devuelve la propia función cuando  │
# │ la firma no cuadra. Sin esta sección se pierde una tarde revisando un  │
# │ secreto que estaba bien.                                                │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Apagarlo NO deja la función abierta: cada una trae su propia autenticación,
# y es MÁS estricta que un JWT porque va atada a quien debe llamarla.

# Tally firma el cuerpo; `createSignatureVerifier` lo comprueba.
[functions.tally-webhook]
verify_jwt = false

# Telegram manda `X-Telegram-Bot-Api-Secret-Token`, que solo conocen los dos.
[functions.telegram-webhook]
verify_jwt = false

# pg_cron manda `x-checkin-cron-secret` y nada más: ni siquiera puede firmar.
[functions.weekly-checkin]
verify_jwt = false

# Esta SÍ lo lleva: la dispara `generation-trigger.ts` con la service role key
# en la cabecera. Es interna, nadie de fuera tiene por qué alcanzarla.
[functions.generate-version]
verify_jwt = true
