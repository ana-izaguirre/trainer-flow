<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three layers: Edge Functions on Deno call the adapters in _shared, which implement the ports of _core, the pure domain. The reverse arrow, from _core to _shared, is forbidden and the linter enforces it.">
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a64"/>
    </marker>
  </defs>

  <!-- Row 1 — Edge Functions -->
  <rect x="60" y="20" width="600" height="90" rx="12" fill="#F4F4F6" stroke="#B8B8C4" stroke-width="2"/>
  <text x="90" y="48" font-family="sans-serif" font-size="14" font-weight="700" fill="#3a3a42">🌐 Edge Functions · Deno</text>
  <text x="90" y="68" font-family="sans-serif" font-size="12" fill="#55555f">telegram-webhook · tally-webhook · generate-version · weekly-checkin</text>
  <text x="90" y="86" font-family="sans-serif" font-size="11" font-style="italic" fill="#787882">HTTP glue only</text>

  <line x1="360" y1="110" x2="360" y2="138" stroke="#5a5a64" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="375" y="129" font-family="sans-serif" font-size="11" fill="#5a5a64">builds the adapters and calls the domain</text>

  <!-- Row 2 — _shared -->
  <rect x="60" y="140" width="600" height="90" rx="12" fill="#E4F7EE" stroke="#3ECF8E" stroke-width="2"/>
  <text x="90" y="168" font-family="sans-serif" font-size="14" font-weight="700" fill="#16543c">🔌 _shared/ · adapters</text>
  <text x="90" y="188" font-family="sans-serif" font-size="12" fill="#2f6b4f">db.ts · telegram/ · ai/gemini-provider.ts</text>
  <text x="90" y="206" font-family="sans-serif" font-size="11" font-style="italic" fill="#4c8a6c">Deno, npm and fetch live here</text>

  <line x1="360" y1="230" x2="360" y2="258" stroke="#5a5a64" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="375" y="249" font-family="sans-serif" font-size="11" fill="#5a5a64">implements the ports</text>

  <!-- Row 3 — _core -->
  <rect x="60" y="260" width="600" height="90" rx="12" fill="#8A63D2" stroke="#5B3FA8" stroke-width="2"/>
  <text x="90" y="288" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">🧠 _core/ · pure TypeScript</text>
  <text x="90" y="308" font-family="sans-serif" font-size="12" fill="#EDE7F9">domain/ · authorization.ts · ports/</text>
  <text x="90" y="326" font-family="sans-serif" font-size="11" font-style="italic" fill="#D9CEF2">no Deno, no npm, no fetch, no I/O</text>

  <!-- Forbidden arrow: _core may never call _shared -->
  <path d="M 700 305 C 760 305, 760 185, 700 185" fill="none" stroke="#D64545" stroke-width="2"/>
  <circle cx="712" cy="245" r="11" fill="#ffffff" stroke="#D64545" stroke-width="2"/>
  <text x="712" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#D64545">✕</text>
  <text x="730" y="241" font-family="sans-serif" font-size="11" font-weight="700" fill="#D64545">never</text>
  <text x="730" y="255" font-family="sans-serif" font-size="10" fill="#D64545">oxlint fails the build</text>
</svg>
