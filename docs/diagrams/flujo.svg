<svg viewBox="0 0 1075 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El cliente llena un formulario, el entrenador crea la rutina con IA, plantilla o a mano, la revisa como borrador en Telegram, la aprueba y recién ahí el cliente la recibe. Gemini es la única pieza opcional del camino.">
  <rect x="0" y="0" width="1075" height="260" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a94"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B3FA8"/>
    </marker>
  </defs>

  <!-- Caja 1 — Cliente llena el formulario -->
  <rect x="10" y="50" width="195" height="90" rx="12" fill="#E8F8F0" stroke="#3ECF8E" stroke-width="2"/>
  <text x="108" y="82" text-anchor="middle" font-family="sans-serif" font-size="20">🧍</text>
  <text x="108" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#16543c">Cliente llena</text>
  <text x="108" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#16543c">el formulario</text>
  <text x="108" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2f6b4f">2–3 min, por Tally</text>

  <line x1="205" y1="95" x2="223" y2="95" stroke="#8a8a94" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caja 2 — Entrenador elige cómo crear la rutina -->
  <rect x="225" y="50" width="195" height="90" rx="12" fill="#F7F5FC" stroke="#8A63D2" stroke-width="2"/>
  <text x="323" y="82" text-anchor="middle" font-family="sans-serif" font-size="20">🧑‍🏫</text>
  <text x="323" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d2a66">Entrenador elige</text>
  <text x="323" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d2a66">cómo crearla</text>
  <text x="323" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5B3FA8">IA · plantilla · manual</text>

  <!-- Gemini, colgando y punteado: la única pieza reemplazable -->
  <line x1="323" y1="140" x2="323" y2="168" stroke="#8A63D2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="243" y="170" width="160" height="46" rx="10" fill="#ffffff" stroke="#8A63D2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="323" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B3FA8">Gemini</text>
  <text x="323" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B3FA8">si falla, sigue sin ella</text>

  <line x1="420" y1="95" x2="438" y2="95" stroke="#8a8a94" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caja 3 — DRAFT en Telegram -->
  <rect x="440" y="50" width="195" height="90" rx="12" fill="#F4F4F6" stroke="#B8B8C4" stroke-width="2"/>
  <text x="538" y="82" text-anchor="middle" font-family="sans-serif" font-size="20">📋</text>
  <text x="538" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#3a3a42">DRAFT</text>
  <text x="538" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#55555f">la revisa en Telegram,</text>
  <text x="538" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#55555f">con botones</text>

  <line x1="635" y1="95" x2="653" y2="95" stroke="#5B3FA8" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="644" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B3FA8">único camino</text>

  <!-- Caja 4 — Aprueba (destacada) -->
  <rect x="655" y="50" width="195" height="90" rx="12" fill="#8A63D2" stroke="#5B3FA8" stroke-width="2"/>
  <text x="753" y="82" text-anchor="middle" font-family="sans-serif" font-size="20">✋</text>
  <text x="753" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Entrenador aprueba</text>
  <text x="753" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#EDE7F9">DRAFT → SENT</text>
  <text x="753" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#EDE7F9">no hay otro camino</text>

  <line x1="850" y1="95" x2="868" y2="95" stroke="#8a8a94" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caja 5 — Cliente recibe -->
  <rect x="870" y="50" width="195" height="90" rx="12" fill="#E8F8F0" stroke="#3ECF8E" stroke-width="2"/>
  <text x="968" y="82" text-anchor="middle" font-family="sans-serif" font-size="20">🧍</text>
  <text x="968" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#16543c">Cliente la recibe,</text>
  <text x="968" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#16543c">ya adaptada</text>
  <text x="968" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2f6b4f">y hace check-in cada semana</text>
</svg>
