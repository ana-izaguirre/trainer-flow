name: Token de Supabase

# ─────────────────────────────────────────────────────────────────────────────
# El access token de Supabase caduca. Cuando eso pasa, el deploy falla con un
# 401 en medio de otra cosa, normalmente el día que hay prisa.
#
# Esto lo pregunta cada lunes. Si el token ya no sirve, el workflow falla y
# GitHub manda un correo — que es justamente el aviso que hacía falta.
#
# No puede avisar ANTES de que caduque: la API de Supabase no expone la fecha
# de vencimiento de un token. Lo que sí hace es que te enteres un lunes
# tranquilo en vez de en mitad de un despliegue.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Lunes a las 9:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  comprobar:
    name: ¿Sigue sirviendo?
    runs-on: ubuntu-latest
    steps:
      - name: Preguntar a la API de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::No hay SUPABASE_ACCESS_TOKEN configurado."
            exit 1
          fi

          # `-o /dev/null` para que la respuesta no acabe en los logs: lista
          # los proyectos de la cuenta.
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            https://api.supabase.com/v1/projects)

          if [ "$codigo" = "200" ]; then
            echo "El token sirve."
            exit 0
          fi

          {
            echo "### El token de Supabase ya no sirve (HTTP $codigo)"
            echo
            echo "El despliegue automático va a fallar hasta que lo renueves:"
            echo
            echo "1. https://supabase.com/dashboard/account/tokens → **Generate new token**"
            echo "2. Cópialo (se muestra **una sola vez**)"
            echo "3. Settings → Secrets and variables → Actions → \`SUPABASE_ACCESS_TOKEN\` → **Update**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::El token de Supabase ya no sirve (HTTP $codigo). Renuévalo en account/tokens."
          exit 1
