name: Supabase token

# ─────────────────────────────────────────────────────────────────────────────
# The Supabase access token expires. When it does, the deploy fails with a 401
# in the middle of something else, usually on a day when there is no time.
#
# This asks every Monday. If the token no longer works the workflow fails and
# GitHub sends an email — which is exactly the warning that was missing.
#
# It cannot warn BEFORE it expires: the Supabase API does not expose a token's
# expiry date. What it does achieve is that you find out on a quiet Monday
# rather than halfway through a deploy.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Mondays at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Is it still valid?
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Supabase API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::No SUPABASE_ACCESS_TOKEN is configured."
            exit 1
          fi

          # `-o /dev/null` keeps the response out of the logs: it lists the
          # account's projects.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            https://api.supabase.com/v1/projects)

          if [ "$code" = "200" ]; then
            echo "The token is valid."
            exit 0
          fi

          {
            echo "### The Supabase token no longer works (HTTP $code)"
            echo
            echo "Automatic deploys will fail until you renew it:"
            echo
            echo "1. https://supabase.com/dashboard/account/tokens → **Generate new token**"
            echo "2. Copy it (shown **only once**)"
            echo "3. Settings → Secrets and variables → Actions → \`SUPABASE_ACCESS_TOKEN\` → **Update**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::The Supabase token no longer works (HTTP $code). Renew it at account/tokens."
          exit 1
