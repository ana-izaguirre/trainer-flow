name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Only deploys what ALREADY passed CI.
#
# `workflow_run` waits for CI to finish on `main` and reads its conclusion.
# With `on: push` the deploy would run in parallel with verification, and a
# broken commit would reach production before anyone noticed.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand: Actions tab → Deploy → Run workflow. Staging accepts ANY branch
  # (that is its point: try a branch before merging it); production only
  # accepts `main`, checked in "Check the configuration".
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        # A mistaken click should land on staging, never on production.
        default: staging

# Two deploys at once on the SAME project would leave its database
# half-migrated, so they queue instead of cancelling. Staging and production
# are different projects: one does not wait for the other.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations and Edge Functions
    runs-on: ubuntu-latest

    # ┌─ THE TWO GATES ────────────────────────────────────────────────────┐
    # │ 1. Reaching `main` requires a PR with CI green. Turn that on under  │
    # │    Settings → Branches → Require a pull request. Without it, a      │
    # │    `git push` straight to main ships on its own.                    │
    # │                                                                     │
    # │ 2. `environment: production` allows requiring a MANUAL approval     │
    # │    before deploying: Settings → Environments → production →         │
    # │    Required reviewers. Until it is configured it blocks nothing, so  │
    # │    declaring it here costs nothing and enables it whenever wanted.   │
    # │    Staging gets its own environment, without that gate.             │
    # └─────────────────────────────────────────────────────────────────────┘
    #
    # `inputs.target` is never empty on a dispatch (it is a choice with a
    # default), so this `&& ||` cannot fall through to production by accident.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}

    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}

    # `workflow_dispatch` carries no `workflow_run`, so it is accepted when
    # absent. What never passes is a red CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits are needed to compare what changed.
          fetch-depth: 2

      # ┌─ WHY IT COMPARES, AND WHY THE COMPARISON IS COARSE ────────────────┐
      # │ A commit that only touches a .md has nothing to deploy, and        │
      # │ `functions deploy` would create a new version of every function    │
      # │ for nothing.                                                       │
      # │                                                                    │
      # │ It looks at `supabase/` AS A WHOLE, not migrations and functions    │
      # │ separately. Being finer-grained brings the classic failure: a      │
      # │ deploy fails, the next commit only touches one of the two folders, │
      # │ and the other silently stays behind.                               │
      # │                                                                    │
      # │ To force one: Actions → Deploy → Run workflow.                     │
      # └────────────────────────────────────────────────────────────────────┘
      - name: Is there anything to deploy?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "any=true"            >> "$GITHUB_OUTPUT"
            echo "reason=run manually" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `HEAD^` is main before the merge, so this is the PR's whole change.
          touched=$(git diff --name-only HEAD^ HEAD -- supabase/ || true)

          if [ -z "$touched" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "reason=no changes under supabase/" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "reason=$(echo "$touched" | wc -l) file(s) under supabase/" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.any == 'true'
        with:
          version: latest

      # ┌─ WHY THE PROJECT REF IS READ FROM BOTH PLACES ─────────────────────┐
      # │ `vars.` only reads Variables and `secrets.` only reads Secrets. The │
      # │ project ref is not sensitive, so a Variable is the right home — but │
      # │ putting it under Secrets is the obvious mistake, and the failure it │
      # │ produces is `--project-ref ""`, which says nothing about why.       │
      # │                                                                     │
      # │ Reading both makes either placement work, and the check below turns │
      # │ "not set anywhere" into a message that names both places.           │
      # └─────────────────────────────────────────────────────────────────────┘
      #
      # ┌─ STAGING NEVER FALLS BACK TO PRODUCTION ───────────────────────────┐
      # │ Staging reads its OWN names (STAGING_SUPABASE_PROJECT_REF,          │
      # │ STAGING_SUPABASE_DB_PASSWORD). Environment-scoped secrets would     │
      # │ silently fall back to the repository-level ones — which are         │
      # │ production's — whenever one is missing. With separate names, a     │
      # │ missing staging value is an error, never a deploy to production.    │
      # │                                                                     │
      # │ The choice happens in bash on purpose: the `a && b || c` idiom in   │
      # │ an expression returns `c` when `b` is empty, which here would mean  │
      # │ production's ref.                                                   │
      # └─────────────────────────────────────────────────────────────────────┘
      - name: Check the configuration before touching anything
        id: config
        if: steps.changes.outputs.any == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF || secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          missing=0

          case "$TARGET" in
            production)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Production only deploys main, and this run is on $GITHUB_REF. To try a branch, run it again with target = staging."
                exit 1
              fi
              PROJECT_REF="$PROD_REF"
              DB_PASSWORD="$PROD_DB_PASSWORD"
              prefix=""
              ;;
            staging)
              PROJECT_REF="$STAGING_REF"
              DB_PASSWORD="$STAGING_DB_PASSWORD"
              prefix="STAGING_"
              ;;
            *)
              echo "::error::Unknown target '$TARGET'."
              exit 1
              ;;
          esac

          if [ -z "${PROJECT_REF}" ]; then
            echo "::error::${prefix}SUPABASE_PROJECT_REF is empty. Set it under Settings → Secrets and variables → Actions, in either the Variables tab (preferred, it is not sensitive) or Secrets. It is the id in your dashboard URL: /dashboard/project/<THIS>."
            missing=1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty. Generate one at https://supabase.com/dashboard/account/tokens and add it under Secrets."
            missing=1
          fi

          if [ -z "${DB_PASSWORD}" ]; then
            echo "::error::${prefix}SUPABASE_DB_PASSWORD is empty. It is the database password, under Project Settings → Database."
            missing=1
          fi

          [ "$missing" = "1" ] && exit 1

          if [ "$TARGET" = "staging" ] && [ "$PROJECT_REF" = "$PROD_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF is the same as production's. Staging must be a separate Supabase project."
            exit 1
          fi

          # An expired token makes `supabase link` fail with a 401 that explains
          # nothing. Failing here says what to do instead.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            https://api.supabase.com/v1/projects)

          if [ "$code" != "200" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not valid (HTTP $code). Renew it at https://supabase.com/dashboard/account/tokens and update the secret."
            exit 1
          fi

          echo "ref=${PROJECT_REF}" >> "$GITHUB_OUTPUT"

          # The password of the CHOSEN project, for `link` and `db push`. It
          # comes from a secret, so the runner keeps masking it in the logs.
          echo "SUPABASE_DB_PASSWORD=${DB_PASSWORD}" >> "$GITHUB_ENV"

      # The order is NOT interchangeable: an Edge Function does not create
      # tables, it only reads and writes the ones that exist. The other way
      # round, the first webhook fails with "relation does not exist".
      #
      # SUPABASE_DB_PASSWORD is NOT set here on purpose: it comes from
      # $GITHUB_ENV, already resolved for the target. A step-level `env`
      # would override it with production's.
      - name: Link the project
        if: steps.changes.outputs.any == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ steps.config.outputs.ref }}"

      # Migrations are immutable and additive only (SPEC-000 rule 8), so
      # applying new ones is safe. One that dropped data should not come
      # through here without a human looking at it.
      # Like `link`, it takes SUPABASE_DB_PASSWORD from $GITHUB_ENV, and the
      # project from the link above: both already resolved for the target.
      - name: Migrations
        if: steps.changes.outputs.any == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Edge Functions
        if: steps.changes.outputs.any == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

      # ┌─ THE TWO pg_cron JOBS DO NOT TRAVEL WITH THE MIGRATIONS ───────────┐
      # │ They need the function URL and a secret, so they are scheduled by  │
      # │ hand (DEPLOY.md steps 8 and 8b), and nothing else notices if one   │
      # │ is missing: the weekly check-in or the stuck-GENERATING sweep just │
      # │ never runs. This turns that silent gap into a red deploy.          │
      # │                                                                    │
      # │ It runs AFTER the functions: if it fails, the code is already      │
      # │ deployed and fine — what is missing is the manual step it names.   │
      # │                                                                    │
      # │ Production only: staging does not need to send real check-ins.     │
      # └────────────────────────────────────────────────────────────────────┘
      - name: pg_cron jobs are scheduled
        if: steps.changes.outputs.any == 'true' && env.TARGET == 'production'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! rows=$(supabase db query --linked --agent no -o json \
            "select jobname from cron.job where active and jobname in ('weekly-checkin', 'sweep-generating')"); then
            echo "::error::Could not read cron.job. Is the pg_cron extension enabled? See docs/DEPLOY.md step 8."
            exit 1
          fi

          # The CLI prints a bare array; the object form is accepted too so a
          # change in its output shape fails on the job names, not on jq.
          found=$(jq -r '(if type == "array" then . else .rows end) | .[].jobname' <<< "$rows")

          missing=0
          for job in "weekly-checkin:8" "sweep-generating:8b"; do
            name="${job%%:*}"
            step="${job##*:}"
            if ! grep -qx "$name" <<< "$found"; then
              echo "::error::The pg_cron job '$name' is missing or inactive. Schedule it with docs/DEPLOY.md step $step (supabase/cron/$name.sql)."
              missing=1
            fi
          done

          exit "$missing"

      # Leaves what happened on the Actions tab, without opening the logs.
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
            {
              echo "### Nothing deployed"
              echo
              echo "${{ steps.changes.outputs.reason }}."
              echo
              echo "To force one: Actions → Deploy → **Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Deployed to ${TARGET}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Target | **${TARGET}** |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Reason | ${{ steps.changes.outputs.reason }} |"
            echo "| Migrations | $(ls supabase/migrations/*.sql | wc -l) |"
            echo "| Functions | $(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f ') |"
          } >> "$GITHUB_STEP_SUMMARY"
