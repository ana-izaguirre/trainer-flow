name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Un push nuevo cancela el CI anterior de la misma rama… salvo en `main`.
#
# En una rama de trabajo cancelar es lo correcto: el commit viejo ya no
# importa y se ahorran minutos. En `main` es lo contrario: cancelar deja un
# commit de la rama principal SIN VERIFICAR PARA SIEMPRE, y nadie se entera
# porque un run cancelado se parece a uno fallido.
#
# Pasó de verdad: seis PR mergeados en noventa segundos dejaron cuatro
# commits de `main` sin comprobar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ─────────────────────────────────────────────────────────────────────────────
# Por qué TRES jobs y no uno
#
# GitHub muestra una fila por JOB, no por paso. Con todo dentro de «Verificar»,
# un fallo se ve como «Verificar ✗» y hay que abrirlo para saber si fue un
# tipo, el linter o un test.
#
# Tres es el punto de equilibrio: cada uno dice en su nombre qué protege, y no
# se paga la instalación de dependencias seis veces.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  tipos-y-lint:
    name: Tipos y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tipos · tsc sobre _core y tests
        run: pnpm typecheck

      # Comprueba que el MISMO _core compila también bajo Deno, que es la
      # premisa del ADR-001 y sin esto sería una suposición.
      - name: Tipos · Deno sobre las Edge Functions (ADR-001)
        run: pnpm deno:check

      # oxlint hace cumplir el aislamiento de _core: sin Deno, sin process,
      # sin fetch, sin imports npm:/jsr:/https: ni de _shared.
      - name: Lint · oxlint, con el aislamiento de _core
        run: pnpm lint

      - name: Lint · Deno
        run: pnpm deno:lint

  tests:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # PostgreSQL pelado, no Supabase: tests/sql/00-supabase-roles.sql reproduce
    # los roles que un proyecto de Supabase trae de fábrica.
    #
    # ┌─ `postgres:postgres` DE ABAJO NO ES UN SECRETO ────────────────────────┐
    # │ Es un contenedor que GitHub crea y destruye dentro del runner. Escucha │
    # │ en localhost de esa VM efímera: no hay nada que alcanzar desde fuera,  │
    # │ y la base se crea vacía, se llena con las migraciones y se tira.       │
    # │                                                                        │
    # │ La prueba de si algo es un secreto es si conocerlo da acceso a algo.   │
    # │ Aquí no hay a qué.                                                     │
    # │                                                                        │
    # │ Las credenciales de Supabase de verdad NO viven aquí ni en ningún      │
    # │ archivo del repositorio: van por `supabase secrets set`. Ver           │
    # │ docs/SECURITY.md.                                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Falla si la cobertura global, o la de authorization.ts,
      # state-machine.ts o validate-draft.ts, baja del 100%.
      - name: Unit · _core, con cobertura del 100% obligatoria
        run: pnpm test:coverage

      # `_shared` y los handlers usan Deno.env e imports npm:, así que desde
      # Node no se pueden probar. Aquí se comprueba el CABLEADO: el nombre de
      # una variable, el del header, que un secreto que falta se note al
      # arrancar (SPEC-011).
      - name: Deno · _shared y los handlers (el cableado)
        run: pnpm deno:test

      - name: Integración y E2E · contra PostgreSQL
        run: pnpm test:integration

      # `always()` para que la tabla aparezca también cuando un umbral falla:
      # ahí es cuando más falta hace verla.
      - name: Comentar la cobertura en el PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: pr

  secretos:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un secreto commiteado es un bloqueante (CLAUDE.md).
      - name: Escanear el historial
        run: |
          patron='(gemini|telegram|tally|supabase)[_a-z]*(key|token|secret)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{16,}'
          # Se escanea TAMBIÉN .github/workflows. Un secreto pegado en el CI
          # es tan secreto como uno pegado en el código, y es un sitio donde
          # es fácil que aparezca "solo para probar".
          if git grep -rniE "$patron" -- ':!pnpm-lock.yaml'; then
            echo "::error::Posible secreto en el repositorio"
            exit 1
          fi
          echo "Sin secretos aparentes."

      # Las URLs de descarga de Tally llevan un JWT dentro. Ni en un fixture.
      - name: Comprobar que ningún JWT quedó en el repositorio
        run: |
          if git grep -rnE 'eyJ[A-Za-z0-9_-]{10,}\.' -- ':!pnpm-lock.yaml'; then
            echo "::error::Hay un JWT en el repositorio"
            exit 1
          fi
          echo "Ningún JWT."

      # Cualquier .env en cualquier directorio, no solo en la raíz.
      # Único permitido: .env.example, que no contiene secretos ni sus nombres.
      - name: Comprobar que ningún .env está versionado
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Hay archivos .env versionados:"
            echo "$tracked"
            exit 1
          fi
          echo "Ningún .env versionado."

      # .env.example nunca debe llevar el nombre de una clave: un hueco vacío
      # llamado GEMINI_API_KEY= es una invitación a pegarla ahí.
      - name: Comprobar que .env.example no declara secretos
        run: |
          declarados=$(grep -vE '^[[:space:]]*#' .env.example \
            | grep -iE '^[[:space:]]*[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z_]*=' || true)
          if [ -n "$declarados" ]; then
            echo "::error::.env.example declara variables de secreto:"
            echo "$declarados"
            exit 1
          fi
          echo ".env.example limpio."
