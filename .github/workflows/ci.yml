name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push cancels the previous run on the same branch… except on `main`.
#
# On a working branch cancelling is right: the old commit no longer matters and
# it saves minutes. On `main` it is the opposite — cancelling leaves a commit on
# the main branch UNVERIFIED FOREVER, and nobody notices because a cancelled run
# looks a lot like a failed one.
#
# This actually happened: six PRs merged in ninety seconds left four commits on
# `main` unchecked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ─────────────────────────────────────────────────────────────────────────────
# Why THREE jobs and not one
#
# GitHub shows one row per JOB, not per step. With everything inside a single
# "Verify" job, a failure reads as "Verify ✗" and you have to open it to find
# out whether it was a type, the linter or a test.
#
# Three is the sweet spot: each name says what it guards, without paying for
# dependency installation six times over.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  types-and-lint:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Types · tsc over _core and tests
        run: pnpm typecheck

      # Proves the SAME `_core` also compiles under Deno, which is the premise
      # of ADR-001 and would otherwise be an assumption.
      - name: Types · Deno over the Edge Functions (ADR-001)
        run: pnpm deno:check

      # oxlint enforces the isolation of `_core`: no Deno, no process, no fetch,
      # no npm:/jsr:/https: imports and nothing from `_shared`.
      - name: Lint · oxlint, including the _core isolation rules
        run: pnpm lint

      - name: Lint · Deno
        run: pnpm deno:lint

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # Bare PostgreSQL, not Supabase: tests/sql/00-supabase-roles.sql recreates
    # the roles a Supabase project ships with.
    #
    # ┌─ THE `postgres:postgres` BELOW IS NOT A SECRET ────────────────────────┐
    # │ It is a container GitHub creates and destroys inside the runner. It    │
    # │ listens on localhost of that ephemeral VM: there is nothing reachable  │
    # │ from outside, and the database is created empty, filled by the         │
    # │ migrations and thrown away.                                            │
    # │                                                                        │
    # │ The test for whether something is a secret is whether knowing it gives │
    # │ access to anything. Here there is nothing to access.                   │
    # │                                                                        │
    # │ The real Supabase credentials do NOT live here or in any file in the   │
    # │ repository: they go through `supabase secrets set`. See                │
    # │ docs/SECURITY.md.                                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    services:
      postgres:
        # La misma major que el proyecto alojado. Probar sobre una versión
        # distinta de la que corre en producción es una diferencia pequeña
        # hasta el día que no lo es.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails if global coverage, or that of authorization.ts, state-machine.ts
      # or validate-draft.ts, drops below 100%.
      - name: Unit · _core, with mandatory 100% coverage
        run: pnpm test:coverage

      # `_shared` and the handlers use Deno.env and npm: imports, so they cannot
      # be tested from Node. This is where the WIRING is checked: the name of an
      # environment variable, the name of a header, that a missing secret is
      # noticed at startup (SPEC-011).
      - name: Deno · _shared and the handlers (the wiring)
        run: pnpm deno:test

      - name: Integration and E2E · against PostgreSQL
        run: pnpm test:integration

      # `always()` so the table also shows up when a threshold fails: that is
      # exactly when it is most useful.
      - name: Comment coverage on the PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: pr

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A committed secret is a blocker (CLAUDE.md).
      #
      # ┌─ WHY EVERY COMMIT, NOT JUST THE CHECKOUT ──────────────────────────┐
      # │ `git grep` with no revision searches the WORKING TREE. This step   │
      # │ was named "Scan the history" and did not scan it: a secret that    │
      # │ was committed and then deleted passed CI while still sitting in    │
      # │ the history, readable by anyone who clones. Deleting a leaked      │
      # │ secret from a file does not unleak it.                             │
      # │                                                                    │
      # │ The output is captured instead of used as the `if` condition:      │
      # │ xargs may split into several batches, and only the last batch's    │
      # │ exit code would survive.                                           │
      # └────────────────────────────────────────────────────────────────────┘
      - name: Scan the history
        run: |
          pattern='(gemini|telegram|tally|supabase)[_a-z]*(key|token|secret)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{16,}'
          # .github/workflows IS scanned too. A secret pasted into CI is just as
          # much a secret as one pasted into the code, and CI is a place where
          # one easily shows up "just to test something".
          found=$(git rev-list --all | xargs -r git grep -nIiE "$pattern" -- ':!pnpm-lock.yaml' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Possible secret in the repository history"
            exit 1
          fi
          echo "No secrets found, in any commit."

      # Tally's download URLs carry a JWT inside. Not even in a fixture.
      - name: Check no JWT was left in the repository
        run: |
          found=$(git rev-list --all | xargs -r git grep -nIE 'eyJ[A-Za-z0-9_-]{10,}\.' -- ':!pnpm-lock.yaml' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::There is a JWT in the repository history"
            exit 1
          fi
          echo "No JWTs, in any commit."

      # Any .env in any directory, not just the root. The only one allowed is
      # .env.example, which contains no secrets and not even their names.
      - name: Check no .env is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env files:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."

      # .env.example must never carry the name of a key: an empty slot called
      # GEMINI_API_KEY= is an invitation to paste one there.
      - name: Check .env.example declares no secrets
        run: |
          declared=$(grep -vE '^[[:space:]]*#' .env.example \
            | grep -iE '^[[:space:]]*[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z_]*=' || true)
          if [ -n "$declared" ]; then
            echo "::error::.env.example declares secret variables:"
            echo "$declared"
            exit 1
          fi
          echo ".env.example is clean."
