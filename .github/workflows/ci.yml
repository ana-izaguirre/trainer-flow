name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Un push nuevo cancela el CI anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest

    # `pull-requests: write` para comentar la cobertura en el PR.
    permissions:
      contents: read
      pull-requests: write

    # Los tests de integración corren contra PostgreSQL pelado, no contra
    # Supabase: tests/sql/00-supabase-roles.sql reproduce los roles que un
    # proyecto de Supabase trae de fábrica. Por eso basta un contenedor.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # El código de las Edge Functions corre en Deno, no en Node. Esto
      # comprueba que el MISMO `_core` compila en los dos runtimes, que es la
      # premisa del ADR-001 y hasta ahora era una suposición.
      #
      # Deno viene como devDependency, así que la versión la fija el lockfile
      # y no hace falta una action aparte.
      - name: Deno — typecheck de las Edge Functions
        run: pnpm deno:check

      - name: Deno — lint
        run: pnpm deno:lint

      # Falla si la cobertura de authorization.ts, state-machine.ts o
      # validate-draft.ts baja del 100%. Ver vitest.config.ts.
      - name: Tests unitarios y cobertura
        run: pnpm test:coverage

      # Incluye los E2E: comparten el requisito de PostgreSQL.
      - name: Tests de integración y E2E
        run: pnpm test:integration

      # Comenta la tabla de cobertura en el PR. `always()` para que el comentario
      # aparezca también cuando algún umbral del 100% falla: ahí es cuando más
      # falta hace verlo.
      - name: Comentar cobertura en el PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: pr

  secrets:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un secreto commiteado es un bloqueante (CLAUDE.md).
      - name: Escanear el historial
        run: |
          patron='(gemini|telegram|tally|supabase)[_a-z]*(key|token|secret)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{16,}'
          if git grep -rniE "$patron" -- ':!pnpm-lock.yaml' ':!.github/workflows'; then
            echo "::error::Posible secreto en el repositorio"
            exit 1
          fi
          echo "Sin secretos aparentes."

      # Cualquier .env en cualquier directorio, no solo en la raíz.
      # Único permitido: .env.example, que no contiene secretos ni sus nombres.
      - name: Comprobar que ningún .env está versionado
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Hay archivos .env versionados:"
            echo "$tracked"
            exit 1
          fi
          echo "Ningún .env versionado."

      # .env.example nunca debe llevar el nombre de una clave: un hueco vacío
      # llamado GEMINI_API_KEY= es una invitación a pegarla ahí.
      - name: Comprobar que .env.example no declara secretos
        run: |
          declarados=$(grep -vE '^[[:space:]]*#' .env.example \
            | grep -iE '^[[:space:]]*[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z_]*=' || true)
          if [ -n "$declarados" ]; then
            echo "::error::.env.example declara variables de secreto:"
            echo "$declarados"
            exit 1
          fi
          echo ".env.example limpio."
